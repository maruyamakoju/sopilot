apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sopilot.fullname" . }}-secrets
  labels:
    {{- include "sopilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  SOPILOT_API_KEY: {{ .Values.secrets.apiKey | quote }}
  SOPILOT_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  SOPILOT_OAUTH_CLIENTS: {{ .Values.secrets.oauthClientsJson | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  VIGIL_VLM_API_KEY: {{ .Values.secrets.vigilVlmApiKey | quote }}
  {{- if .Values.postgresql.enabled }}
  SOPILOT_DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.auth.username .Values.postgresql.auth.password (include "sopilot.fullname" .) .Values.postgresql.auth.database | quote }}
  {{- end }}
