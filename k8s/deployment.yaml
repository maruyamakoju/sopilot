apiVersion: apps/v1
kind: Deployment
metadata:
  name: sopilot
  namespace: sopilot
  labels:
    app.kubernetes.io/name: sopilot
    app.kubernetes.io/version: "4.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sopilot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sopilot
        app.kubernetes.io/version: "4.0.0"
    spec:
      serviceAccountName: sopilot
      containers:
        - name: sopilot
          image: ghcr.io/maruyamakoju/sopilot:4.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sopilot-config
            - secretRef:
                name: sopilot-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sopilot-data
