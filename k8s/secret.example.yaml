# =============================================================================
# SOPilot Secret — EXAMPLE TEMPLATE
# =============================================================================
# 1. Copy this file: cp k8s/secret.example.yaml k8s/secret.yaml
# 2. Fill in real values (never commit secret.yaml to git)
# 3. Apply: kubectl apply -f k8s/secret.yaml
#
# Or use: kubectl create secret generic sopilot-secrets \
#   --from-literal=SOPILOT_API_KEY=<key> \
#   --from-literal=SOPILOT_JWT_SECRET=<secret> \
#   -n sopilot
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: sopilot-secrets
  namespace: sopilot
type: Opaque
stringData:
  SOPILOT_API_KEY: "REPLACE_ME"
  SOPILOT_JWT_SECRET: "REPLACE_ME_WITH_STRONG_SECRET"
  SOPILOT_OAUTH_CLIENTS: "[]"
  ANTHROPIC_API_KEY: ""
  VIGIL_VLM_API_KEY: ""
  # Uncomment for PostgreSQL:
  # SOPILOT_DATABASE_URL: "postgresql://sopilot:password@postgres:5432/sopilot"
