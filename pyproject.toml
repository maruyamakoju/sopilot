[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sopilot"
version = "6.5.0"
description = "On-prem SOP evaluation service powered by video embeddings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "uvicorn[standard]>=0.30.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "opencv-python-headless>=4.10.0.84",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "jinja2>=3.1.0",
    "fpdf2>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
vjepa2 = [
    "torch>=2.7.0",
    "timm>=1.0.11",
    "einops>=0.8.0",
]
speed = [
    "numba>=0.59.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.28.0",
    "mypy>=1.10.0",
    "locust>=2.29.0",
    "hypothesis>=6.100.0",
    "pymupdf>=1.24.0",
]
research = [
    "torch>=2.7.0",
    "timm>=1.0.11",
    "einops>=0.8.0",
    "numba>=0.59.0",
]
yolo_world = [
    "ultralytics>=8.0.0",
]
otel = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
]
postgres = [
    "psycopg2-binary>=2.9.9",
]
onnx = [
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    # Required by torch.onnx.export with the new TorchDynamo-based exporter
    # in torch >= 2.4. Without it, every export raises "No module named
    # 'onnxscript'" and edge-deployment tests fail silently.
    "onnxscript>=0.1.0",
]
gpu = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.37.0",
    "accelerate>=0.26.0",
    "bitsandbytes>=0.42.0",
    "Pillow>=10.0.0",
    "huggingface-hub>=0.20.0",
    "safetensors>=0.4.0",
    "timm>=1.0.11",
    "einops>=0.8.0",
    "ultralytics>=8.0.0",
]
sam2 = [
    "segment-anything-2>=1.0.0",
]
all = [
    "sopilot[otel,postgres,onnx,vjepa2,yolo_world,speed,gpu,sam2]",
]

[tool.pytest.ini_options]
markers = [
    "performance: latency/throughput benchmarks (deselect with -m 'not performance')",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM105", "SIM108", "B023", "B905"]

[tool.ruff.lint.per-file-ignores]
"sopilot/api/routes.py" = ["B008"]
"tests/test_autopilot_scripts.py" = ["SIM117"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "sopilot.core.fine_tuning",
    "sopilot.core.optimal_transport",
    "sopilot.core.soft_dtw",
    "sopilot.core.metrics",
    "sopilot.core.uncertainty",
]
warn_return_any = false
disallow_untyped_defs = false

[tool.setuptools.packages.find]
include = ["sopilot*"]

[tool.setuptools.package-data]
sopilot = ["ui/*.html", "core/templates/*.html"]
